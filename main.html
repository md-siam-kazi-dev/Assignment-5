<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Issue</title>
    <link rel="icon" type="image/png" href="./assets/github-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./src/output.css">
    <style>
        body {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body class="bg-[#F8FAFC] ">
    <div class="main-nav bg-white w-full border-b-1 border-b-[#ddd] py-4 px-1">
        <div class="nav flex flex-col md:flex-row items-center gap-4 justify-between w-full md:w-19/20 mx-auto">
            <div class="logo flex gap-2 items-center">
                <img src="./assets/github-logo.png" class="max-w-9 max-w-9">
                <h3 class="text-2xl font-semibold">GitHub Issues Tracker</h3>
            </div>
            <!-- input field html fa-hourglass-start -->
            <form id="search-form" class="nav-search flex items-center gap-2">

            
                <label class="input border-none shadow-[0_0_5px_rgba(0,0,0,.2)] outline-none">
                    <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                            stroke="currentColor">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.3-4.3"></path>
                        </g>
                    </svg>
                    <input id="search" type="search" required placeholder="Search issues..."
                        class=" border-none focus:outline-none" />
                </label>

                <button type="submit" id="search-btn" class="btn btn-primary  rounded py-4 px-3"><i class="fa-solid fa-search"></i>Search
                    Issue</button>
                </form>
            <!-- input field html fa-hourglass-end -->
        </div>
    </div>

    <div class="main max-w-[1410px] mx-auto w-19/20 sm:w-17/20 md:w-16/20 lg:w-15/20 mt-15">
        <div id="tab" class="tab bg-white w-full px-1 py-6 sm:px-6 shadow rounded flex justify-start gap-2">
            <button id="all" class="btn tab-btn btn-primary font-semibold w-[90px] sm:w-[120px]">All</button>
            <button id="open" class="btn tab-btn font-semibold w-[90px] sm:w-[120px]">Open</button>
            <button id="closed" class="btn tab-btn font-semibold w-[90px] sm:w-[120px]">Closed</button>
        </div>

  <!-- issue quantity div start  -->
        <div
            class="issue-container-main mt-4 border-b-[#ddd]  shadow p-6 rounded-tr-md rounded-tl-md flex flex-col md:flex-row justify-between items-start gap-4 md:items-center">
            <div class="issue-con-div flex gap-2  items-center">
                <div class="p-2 bg-blue-100 rounded-full"><img src="./assets/Aperture.png"></div>
                <div>
                    <h1 class="font-semibold text-xl"><span id="issue-quantity"></span> Issues</h1>
                    <p class="text-[16px] text-[#64748B]">Track and manage your project issues</p>
                </div>
            </div>

            <div class="indicator flex items-center gap-4">
                <div class="flex gap-1 items-center">
                    <div class="w-3 h-3 bg-green-600 rounded-full"></div>Open
                </div>

                <div class="flex gap-1 items-center">
                    <div class="w-3 h-3 bg-blue-600 rounded-full"></div>Closed
                </div>
            </div>
        </div>
    <!-- issue quantity div end  -->

   <!-- issue card container start  -->
        <div id="issue-card-container"
            class="w-full shadow p-6 rounded-br-md rounded-bl-md grid grid-cols-1 mx-auto sm:grid-cols-2  lg:grid-cols-3 xl:grid-cols-4 gap-6">

            <!-- issue card container generate here  -->


        </div>
    <!-- issue card container end  -->

    </div>


    <!-- Open the modal using ID.showModal() method -->

    <dialog id="modal" class="modal p-8">
    </dialog>

    <!-- end modal  -->


    <script src="./script/mac.js"></script>
    <script src="./script/search.js"></script>
    <script src="./script/renderIssueCard.js"></script>
    <script src="./script/tab.js"></script>

</body>

</html>
