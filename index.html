<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Login</title>
    <link rel="icon" type="image/png" href="./assets/github-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./src/output.css">
    <style>
        body {
            font-family: "Geist", sans-serif;
        }
    </style>
</head>

<body class="flex justify-center items-center min-h-screen">
    <div class="login-div w-full sm:w-8/10 p-8 max-w-[520px] mx-auto shadow-[0_0_5px_rgba(0,0,0,0.1)] rounded-md ">
        <div class="logo-section mb-6 w-full text-center">
            <img src="./assets/github-logo.png" class="mx-auto">
            <h3 class="text-2xl font-semibold mt-6">GitHub Issues Tracker</h3>
            <p class="text-[16px] text-[#64748B]">Sign in to manage your issues</p>

        </div>
        <form id="form">
            <legend class="fieldset-legend font-medium">Username</legend>
            <input id="username" required type="text" value="admin" class="input mb-1.5 w-full "
                placeholder="Enter Username" /><br>
            <p class="label text-blue-600 mb-4">Default:admin</p>
            <legend class="fieldset-legend font-medium">Password</legend>
            <input id="pass" required type="password" value="admin123" class="input w-full"
                placeholder="Enter Password" />
            <br>
            <p class="label text-blue-600">Default:admin123</p>

            <button type="submit" class="btn btn-primary w-full mt-6 font-medium text-[16px]">Sign in</button>
        </form>
        <div class="msg mt-2 mx-auto font-semibold text-gray-400 text-[12px] w-fit"></div>
        <div class="flex items-center text-center mt-6 text-gray-700 font-medium">
            <div class="flex-1 border-b border-gray-300"></div>
            <span class="px-4">OR</span>
            <div class="flex-1 border-b border-gray-300"></div>
        </div>
        <div class="demo mt-6 text-center">
            <p class="text-[14px] text-[#64748B] mb-8">Demo Credentials</p>
            <p class="text-[16px] mb-2"><span class="font-semibold">Username:</span>admin</p>
            <p class="text-[16px] mb-2"><span class="font-semibold">Password:</span>admin123</p>
        </div>

    </div>


    <script src="./script/main.js"></script>
</body>

</html>
